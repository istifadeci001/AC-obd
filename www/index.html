<!DOCTYPE html>
<html lang="az">
<head>

<body>
<header>
  <button id="menu" type="button" aria-label="Menu">☰</button>
  <div class="brand">AC OBD</div>
  <div id="conn" class="pill off"></div>

<main id="view"></main>
<nav id="nav"></nav>
<div id="drawer"><div class="panel" id="drawerlist"></div></div>
<div id="errbox" style="display:none;position:fixed;left:8px;right:8px;bottom:80px;z-index:99;background:#5a1111;color:#fff;font-size:12px;padding:10px;border-radius:8px;word-break:break-all"></div>
<script>
(function () {
  function show(t) {
    var b = document.getElementById('errbox');
    b.style.display = 'block';
    b.textContent += t + '\n';
  }
  window.addEventListener('error', function (e) {
    if (e.target && e.target.src) show('FAYL YOXDUR: ' + e.target.src.split('/').slice(-2).join('/'));
    else show('XƏTA: ' + e.message + ' (' + String(e.filename || '').split('/').pop() + ':' + e.lineno + ')');
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    show('XƏTA: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
})();
</script>
<script src="js/ble.js"></script>

<script src="js/store.js"></script>

<script src="js/transport.js"></script>

<script src="js/obd.js"></script>
<script src="js/ui-obd.js"></script>
</body>
