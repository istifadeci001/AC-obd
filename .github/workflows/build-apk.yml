name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Paketləri quraşdır
        run: npm install

      - name: BLE faylını qur
        run: |
          npm run build:ble
          test -f www/js/ble.js

      - name: Android layihəsini yarat
        run: npx cap add android

      - name: İkonu quraşdır
        run: cp -r branding/res/. android/app/src/main/res/

      - name: Faylları sinxronlaşdır
        run: npx cap sync android

      - name: Sabit imza açarı
        run: |
          mkdir -p ~/.android
          if [ -f branding/debug.keystore ]; then
            cp branding/debug.keystore ~/.android/debug.keystore
          else
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            cp ~/.android/debug.keystore branding/debug.keystore
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add branding/debug.keystore
            git commit -m "Sabit imza acari"
            git push || (git pull --rebase && git push) || echo "Açar repozitoriyaya yazıla bilmədi"
          fi

      - name: Gradle gözləmə limitini artır
        run: sed -i 's/networkTimeout=.*/networkTimeout=120000/' android/gradle/wrapper/gradle-wrapper.properties

      - name: APK qur (3 cəhd)
        working-directory: android
        run: |
          chmod +x gradlew
          for i in 1 2 3; do
            ./gradlew assembleDebug && exit 0
            echo "Cəhd $i alınmadı, 20 san sonra təkrar"
            sleep 20
          done
          exit 1

      - name: APK-nı hazırla
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AC-OBD.apk

      - name: Ehtiyat üçün artifact
        uses: actions/upload-artifact@v4
        with:
          name: AC-OBD-apk
          path: AC-OBD.apk

      - name: Release yarat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest AC-OBD.apk --title "AC OBD son versiya" --notes "v1.1.0"
