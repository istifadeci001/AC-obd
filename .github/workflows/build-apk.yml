name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Paketləri quraşdır
        run: npm install

      - name: BLE faylını qur
        run: |
          npm run build:ble
          test -f www/js/ble.js

      - name: DTC bazasını yüklə (obdex, CC0)
        continue-on-error: true
        run: |
          echo 'window.DTC_BIG={};window.DTC_BIG_N=0;' > www/js/dtc-data.js
          node tools/build-dtc.js

      - name: DTC tərcümələrini əlavə et (varsa)
        run: |
          mkdir -p www/data
          for l in az ru; do
            if [ -f data/dtc-$l.json ]; then
              { printf 'window.DTC_TR_%s=' "$l"; cat data/dtc-$l.json; echo ';'; } > www/data/dtc-$l.js
            else
              echo "window.DTC_TR_$l={};" > www/data/dtc-$l.js
            fi
          done

      - name: Android layihəsini yarat
        run: npx cap add android

      - name: İkonu quraşdır (hazır)
        run: |
          if [ -d branding/res ]; then
            cp -r branding/res/. android/app/src/main/res/
          else
            echo "branding/res tapılmadı, standart ikon qalır"
          fi

      - name: İkonu icon.jpg-dən yarat (varsa)
        continue-on-error: true
        run: |
          if [ -f www/icon.jpg ]; then
            sudo apt-get install -y imagemagick > /dev/null
            RES=android/app/src/main/res
            BGC=$(convert www/icon.jpg -format '%[hex:p{3,3}]' info: | cut -c1-6)
            [ ${#BGC} -eq 6 ] || BGC=0B0F14
            for d in "mdpi 48 108" "hdpi 72 162" "xhdpi 96 216" "xxhdpi 144 324" "xxxhdpi 192 432"; do
              set -- $d
              mkdir -p $RES/mipmap-$1
              convert www/icon.jpg -resize $2x$2^ -gravity center -extent $2x$2 $RES/mipmap-$1/ic_launcher.png
              cp $RES/mipmap-$1/ic_launcher.png $RES/mipmap-$1/ic_launcher_round.png
              S=$(( $3 * 61 / 100 ))
              convert -size $3x$3 xc:none \( www/icon.jpg -resize ${S}x${S} \) -gravity center -composite $RES/mipmap-$1/ic_launcher_foreground.png
            done
            mkdir -p $RES/mipmap-anydpi-v26 $RES/values
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#%s</color>\n</resources>\n' "$BGC" > $RES/values/ic_launcher_background.xml
            for n in ic_launcher ic_launcher_round; do
              printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n' > $RES/mipmap-anydpi-v26/$n.xml
            done
          else
            echo "www/icon.jpg yoxdur, hazır ikon qalır"
          fi

      - name: Faylları sinxronlaşdır
        run: npx cap sync android

      - name: Sabit imza açarı
        continue-on-error: true
        run: |
          mkdir -p ~/.android
          if [ -f branding/debug.keystore ]; then
            cp branding/debug.keystore ~/.android/debug.keystore
          else
            mkdir -p branding
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            cp ~/.android/debug.keystore branding/debug.keystore
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add branding/debug.keystore
            git commit -m "Sabit imza acari"
            git push || (git pull --rebase && git push) || echo "Açar repozitoriyaya yazıla bilmədi"
          fi

      - name: Gradle gözləmə limitini artır
        run: sed -i 's/networkTimeout=.*/networkTimeout=120000/' android/gradle/wrapper/gradle-wrapper.properties

      - name: APK qur (3 cəhd)
        working-directory: android
        run: |
          chmod +x gradlew
          for i in 1 2 3; do
            ./gradlew assembleDebug && exit 0
            echo "Cəhd $i alınmadı, 20 san sonra təkrar"
            sleep 20
          done
          exit 1

      - name: APK-nı hazırla
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AC-OBD.apk

      - name: Ehtiyat üçün artifact
        uses: actions/upload-artifact@v4
        with:
          name: AC-OBD-apk
          path: AC-OBD.apk

      - name: Release yarat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest AC-OBD.apk --title "AC OBD son versiya" --notes "v1.4.0"
